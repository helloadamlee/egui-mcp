[workspace]
members = [
    "crates/egui-mcp-protocol",
    "crates/egui-mcp-client-win",
    "crates/egui-mcp-server-win",
    "examples/demo-app-win",
]

resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"

[workspace.dependencies]
# Common dependencies
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
thiserror = "1.0"
tracing = "0.1"
tracing-subscriber = "0.3"
tokio = { version = "1", features = ["full"] }
